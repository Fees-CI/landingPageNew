name: CI/CD Deploy — Naturalink Landing

on:
  push:
    branches: [stable]
  workflow_dispatch:

env:
  DOCKERHUB_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/naturalink-landing

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:latest
            ${{ env.DOCKERHUB_IMAGE }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy compose file to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OVH_HOST }}
          username: ${{ secrets.OVH_USER }}
          key: ${{ secrets.OVH_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "/home/ubuntu/naturalink-landing/"

      - name: Deploy via SSH to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OVH_HOST }}
          username: ${{ secrets.OVH_USER }}
          key: ${{ secrets.OVH_SSH_KEY }}
          script: |
            set -e
            mkdir -p /home/ubuntu/naturalink-landing
            cd /home/ubuntu/naturalink-landing

            # Generate .env for Next.js runtime + compose variable expansion
            cat > .env << EOF
            NODE_ENV=production
            NEXT_TELEMETRY_DISABLED=1
            DOCKERHUB_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/naturalink-landing
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            DATABASE_URL=postgresql://naturalink:${{ secrets.POSTGRES_PASSWORD }}@postgres:5432/naturalink?schema=public
            NEXT_PUBLIC_URL=${{ secrets.NEXT_PUBLIC_URL }}
            EOF
            chmod 600 .env

            # Docker Hub login
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            # Pull latest images and restart
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Prune only unlabeled dangling images
            docker image prune -f --filter "label!=keep"
