services:
  postgres:
    image: postgres:16-alpine
    container_name: naturalink-postgres
    labels:
      - "keep=true"
    restart: unless-stopped
    environment:
      POSTGRES_USER: naturalink
      POSTGRES_DB: naturalink
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - naturalink_pgdata:/var/lib/postgresql/data
    networks:
      - connect_impact_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U naturalink -d naturalink"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  landing:
    image: ${DOCKERHUB_IMAGE:-ikhe0410/naturalink-landing}:latest
    container_name: naturalink-landing
    labels:
      - "keep=true"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    env_file:
      - .env
    networks:
      - connect_impact_network
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  connect_impact_network:
    driver: bridge

volumes:
  naturalink_pgdata:
