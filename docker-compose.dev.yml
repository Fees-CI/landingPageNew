services:
  postgres:
    image: postgres:16-alpine
    container_name: naturalink-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: naturalink
    ports:
      - "5432:5432"
    volumes:
      - naturalink_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d naturalink"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  naturalink_pgdata:
